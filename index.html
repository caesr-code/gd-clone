  assetAnim=$('#assetAnim')?.value||'none';assetOpacity=clamp(Number($('#assetOpacity')?.value)||1,.05,1);assetGlow=!!$('#assetGlow')?.checked;
  assetCollision=$('#assetCollision')?.value||'none';if(assetCollision!=='none'&&assetLayer!==0){assetLayer=0;toast('Collidable images are automatically placed on the world layer')}
  if(!selectedAsset&&meta.images.length)selectedAsset=meta.images[0].id;
  if(!selectedAsset)return toast('Select or import an image first');tool=70;editTab='assets';A.x();editorUI();toast('Click the stage to place your image')},
 fxPanel(){modal(`<h2>COLOUR & EFFECT DIRECTOR</h2><div class="note">Build animated palettes: place colour keyframes in the timeline, and add beat flashes, camera shakes or pulse triggers from the TRIGGERS tab.</div>
 <div class="formLine"><label>POSITION X <input id="fxX" type="number" min="0" max="5000" step="1" value="${Math.max(0,Math.floor(cam+W/S*.55))}" style="width:88px"></label>
 <label>HUE <input id="fxH" type="number" min="0" max="360" step="1" value="${TH[eth].h}" style="width:70px"></label>
 <label>SAT % <input id="fxS" type="number" min="20" max="100" step="1" value="${TH[eth].s}" style="width:66px"></label>
 <label>LIGHT % <input id="fxL" type="number" min="10" max="65" step="1" value="${TH[eth].l}" style="width:66px"></label>
 <label>ACCENT <input id="fxColor" type="color" value="${TH[eth].a}"></label></div>
 <div class="formLine"><button class="c" data-a="addKeyframe">＋ ADD COLOUR CHANGE</button><button data-a="sampleKeyframe" class="o">USE CURRENT THEME</button></div>
 <div class="assetList" style="display:flex;flex-direction:column;max-height:27vh">${meta.colors.map((c,i)=>`<div class="infoBar" style="display:flex;justify-content:space-between;align-items:center"><span><span style="color:${c.accent}">◆</span> X${c.x} · H${c.h} / S${c.s}%</span><button class="r tiny" data-a="rmColor" data-i="${i}">REMOVE</button></div>`).join('')||'<div class="infoBar">No custom colour changes yet. The default theme is used.</div>'}</div><button class="r" data-a="x">CLOSE</button>`,true)},
 addKeyframe(){const c={x:clamp(+$('#fxX').value|0,0,5000),h:clamp(+$('#fxH').value|0,0,360),s:clamp(+$('#fxS').value||75,20,100),l:clamp(+$('#fxL').value||36,10,65),accent:$('#fxColor').value};meta.colors=meta.colors.filter(t=>t.x!==c.x);meta.colors.push(c);meta.colors.sort((a,b)=>a.x-b.x);save();A.fxPanel();toast('Colour keyframe added')},
 sampleKeyframe(){const p=stageTheme(eth,cam);$('#fxH').value=Math.round(p.h);$('#fxS').value=Math.round(p.s);$('#fxL').value=Math.round(p.l);$('#fxColor').value=p.a},
 rmColor(el){meta.colors.splice(+el.dataset.i,1);save();A.fxPanel()},
};
function structuredMeta(){return safeMeta(JSON.parse(JSON.stringify(meta)))}
function readBlob(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)})}
async function handleImageFile(e){const files=[...(e.target.files||[])].slice(0,10);if(!files.length)return;
 for(const f of files){if(!f.type.startsWith('image/'))continue;if(f.size>12e6){toast('Skip '+f.name+': maximum 12 MB per image');continue}
  try{const data=await readBlob(f),im=new Image();await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=data});
   const scale=Math.min(1,1024/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));
   const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
   let src=c.toDataURL('image/webp',.87);if(!src.startsWith('data:image/webp'))src=c.toDataURL('image/png');
   const id='img_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);if(meta.images.length>=30)break;meta.images.push({id,name:f.name.slice(0,50),src});selectedAsset=id;
  }catch(err){console.error(err);toast('Unable to read '+f.name)}
 }
 e.target.value='';save();editTab='assets';tool=70;if($('#md'))A.assetPanel();else editorUI();toast('Artwork imported. Select and place it!')
}
async function handleAudioFile(e){const file=e.target.files?.[0];if(!file)return;if(file.size>45e6)return toast('Max audio file size is 45 MB');
 const id='track_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);meta.musicId=id;meta.musicName=file.name.slice(0,120);meta.songMode='custom';await putMedia(id,file);save();e.target.value='';
 createWave(file).catch(()=>{});if($('#md'))A.musicPanel();else editorUI();toast('Music imported. Check BPM and beat offset!')
}
async function createWave(file){if(!au()||file.size>40e6)return;try{const data=await file.arrayBuffer(),buf=await ac.decodeAudioData(data.slice(0)),ch=buf.getChannelData(0),n=260,rate=Math.max(1,Math.floor(ch.length/n)),out=[];
 for(let i=0;i<n;i++){let r=0;for(let k=i*rate;k<Math.min((i+1)*rate,ch.length);k+=Math.max(1,rate/80|0)){let v=ch[k]||0;r=Math.max(r,Math.abs(v))}out.push(r)}audioWave=out;drawWaveWidget()}catch(e){console.warn('Waveform not decoded; track may still play',e)}}
function drawWaveWidget(){let c=$('#waveMini');if(!c)return;let cx=c.getContext('2d'),w=c.width,h=c.height;cx.fillStyle='#030f28';cx.fillRect(0,0,w,h);cx.fillStyle='#65eaff';let vals=audioWave.length?audioWave:Array.from({length:200},(_,i)=>.14+.25*Math.abs(Math.sin(i*.27)+Math.sin(i*.11)));
 let step=w/vals.length;for(let i=0;i<vals.length;i++){let v=vals[i]*h*.48;cx.fillRect(i*step,h/2-v,Math.max(1,step-1),v*2)}cx.strokeStyle='#fdf776';cx.globalAlpha=.5;for(let i=0;i<20;i++){let x=i*w/20;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,h);cx.stroke()}cx.globalAlpha=1}
async function blobDataURL(blob){return await readBlob(blob)}
function dataURLBlob(data){const m=/^data:([^;,]+)?(?:;base64)?,(.*)$/s.exec(data);if(!m)return null;let raw=atob(m[2]),arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return new Blob([arr],{type:m[1]||'application/octet-stream'})}
async function loadPackage(file){if(file.size>65e6)return toast('Level package too large');try{const raw=await file.text(),d=JSON.parse(raw);if(d.format!=='GEOMETRIC_DASH_LEVEL'||!Array.isArray(d.objects))return toast('Not a Geometric Dash level package');
 let imported=dec(enc(String(d.name||'Imported Level'),d.theme,d.objects,d.meta));if(!imported)return toast('Could not parse level');
 // Level packages keep the actual data URI pixel assets, unlike copyable text codes.
 imported.meta=safeMeta(d.meta);
 if(d.embeddedAudio){let b=dataURLBlob(d.embeddedAudio);if(b){const id='track_'+Date.now().toString(36);await putMedia(id,b);imported.meta.musicId=id;imported.meta.songMode='custom'}}
 packToGame(imported);A.x();edit(true);toast('Level package imported with artwork'+(d.embeddedAudio?' and audio':''))
 }catch(err){console.error(err);toast('Unable to import level package')}}
ui.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&typeof A[b.dataset.a]==='function'){e.preventDefault();A[b.dataset.a](b)}});

function press(){if(scene!=='play'||paused||won||p.dead)return;hold=1;buf=.12}
addEventListener('keydown',e=>{
 const tag=e.target?.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;
 if(['Space','ArrowUp','KeyW'].includes(e.code)&&scene==='play'){e.preventDefault();if(!e.repeat)press()}

  if(e.code==='ArrowRight'||e.code==='KeyD')cam+=2;

 }

const blockTouchMove=e=>{const t=e.target;if(t&&t.closest&&t.closest('input,textarea,select,.ov,.builderTop,.builderBottom'))return;if(e.cancelable)e.preventDefault()};

addEventListener('pointerdown',()=>{if(TOUCH_VIEWPORT)scrollTo(0,0);au()},{capture:true});

function place(e){const r=cv.getBoundingClientRect(),rawX=Math.floor((e.clientX-r.left)*D/S+cam),y=Math.floor((GY-(e.clientY-r.top)*D)/S);
 let x=rawX;if(meta.beatSnap&&tool>=0&&tool!==70){const bd=10.4*60/(meta.bpm||128),step=bd/meta.beatSnap;x=Math.round(Math.round(rawX/step)*step)}
 hov=[x,y];if(y<0||y>9||rawX<0||!(e.buttons&3))return;
 const er=(e.buttons&2)||tool<0;
 if(er){let before=LV.length;LV=LV.filter(o=>!(o[1]===rawX&&o[2]===y));
  if(LV.length===before&&meta.stickers.length){let i=meta.stickers.findLastIndex(s=>{const par=s.layer===-2?.19:s.layer===-1?.49:s.layer===2?1.15:1;const projected=s.x+cam*(1-par);return rawX>=projected&&rawX<=projected+s.w&&y>=s.y&&y<=s.y+s.h});if(i>=0){meta.stickers.splice(i,1);save();toast('Image placement removed')}}
  else{const B=10.4*60/meta.bpm;meta.cues=meta.cues.filter(b=>Math.round(b*B)!==rawX)}idx(LV);return}
 if(tool===70){let id=selectedAsset||meta.images[0]?.id;if(!id)return toast('Import an image first');let key=id+'_'+rawX+'_'+y;if(lastPlace===key)return;lastPlace=key;
  meta.stickers.push({id,x:rawX,y,w:assetW,h:assetH,layer:assetLayer,alpha:assetOpacity,bob:assetAnim==='bob',spin:assetAnim==='spin',pulse:assetAnim==='pulse',glow:assetGlow,collision:assetCollision});
  if(meta.stickers.length>2000)meta.stickers.shift();save();return}
 if(lastPlace===tool+'_'+x+'_'+y)return;lastPlace=tool+'_'+x+'_'+y;
 const i=LV.findIndex(o=>o[1]===x&&o[2]===y);if(i>=0){if(LV[i][0]===tool)return;LV.splice(i,1)}
 LV.push([tool,x,y]);if(tool===52){const B=10.4*60/meta.bpm;const beat=Math.round(x/B);if(!meta.cues.includes(beat))meta.cues.push(beat)}
 st.b++;if(st.b>=30)award(4);sfx(920,.035,'square',.013);idx(LV);
}
