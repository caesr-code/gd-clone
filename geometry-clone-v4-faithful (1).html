 impedit(){const d=dec($('#t3').value);if(!d)return $('#er').textContent='Invalid code';LV=d.L;name=d.n;eth=d.th;save();cam=-3;A.x();edit(1)},
 achs(){modal(`<h2>ACHIEVEMENTS</h2>${ACH.map((a,i)=>`<div class="card" style="${aw[i]?'':'opacity:.6'}"><b>${aw[i]?'✔':'🔒'} ${a.n}</b><span>${a.t}</span></div>`).join('')}<button class="r" data-a="x">Close</button>`)},
 cfg(){modal(`<h2>SETTINGS</h2><button data-a="tmus">Music: ${set.mus?'ON':'OFF'}</button><button data-a="tsfx">SFX: ${set.sfx?'ON':'OFF'}</button><button data-a="thb">Hitboxes: ${set.hb?'ON':'OFF'}</button><button data-a="tauto">Auto checkpoints: ${set.auto?'ON':'OFF'}</button><button class="r" data-a="rst">Reset progress</button><button class="c" data-a="x">Close</button>`)},
 tmus(){set.mus^=1;sv('gc_set',set);if(!set.mus)mstop();else if(scene=='menu')mstart(3);A.cfg()},tsfx(){set.sfx^=1;sv('gc_set',set);A.cfg()},thb(){set.hb^=1;sv('gc_set',set);A.cfg()},tauto(){set.auto^=1;sv('gc_set',set);A.cfg()},
 mus(){set.mus^=1;sv('gc_set',set);if(!set.mus)mstop();else mstart(3);menu()},
 rst(){if(confirm('Erase all progress and unlocks?')){aw={};st={d:0,best:{},comp:{},b:0,coins:{}};skin={i:0,c1:'#7dff00',c2:'#00e5ff',tr:1};sv('gc_aw',aw);savS();sv('gc_skin',skin);A.menu()}},
 x(){const m=$('#md');if(m)m.remove()},
 ic(el){skin.i=+el.dataset.i;sv('gc_skin',skin);kit()},c1(el){skin.c1=el.dataset.c;sv('gc_skin',skin);kit()},c2(el){skin.c2=el.dataset.c;sv('gc_skin',skin);kit()},tr(){skin.tr^=1;sv('gc_skin',skin);kit()}};
ui.onclick=e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b)};

// ---------- input
function press(){hold=1;buf=.12}
addEventListener('keydown',e=>{
 if(e.target.tagName=='INPUT'||e.target.tagName=='TEXTAREA')return;if(!paused)au();
 if(['Space','ArrowUp','KeyW'].includes(e.code)&&scene=='play'){e.preventDefault();if(!e.repeat)press()}
 if(scene=='play'&&e.code=='KeyZ')cpAdd();if(scene=='play'&&e.code=='KeyX')cps.pop();
 if(e.code=='Escape'){if(paused)A.resume();else if($('#md'))A.x();else if(scene=='play')A.pause();else if(scene=='edit'||scene=='kit')menu()}
 if(scene=='edit'){if((e.ctrlKey||e.metaKey)&&e.code=='KeyZ'){e.preventDefault();A.undo()}if(e.code=='ArrowRight'||e.code=='KeyD')cam+=2;if(e.code=='ArrowLeft'||e.code=='KeyA')cam=Math.max(-4,cam-2)}});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))hold=0});
// Never let touch scrolling, rubber-banding or pinch gestures move the game.
// Text fields are exempt so level names/import codes remain editable.
const blockTouchMove=e=>{const t=e.target;if(t&&t.closest&&t.closest('input,textarea,.ov,.bar.bt'))return;if(e.cancelable)e.preventDefault()};
document.addEventListener('touchmove',blockTouchMove,{passive:false,capture:true});
document.addEventListener('gesturestart',blockTouchMove,{passive:false,capture:true});
document.addEventListener('gesturechange',blockTouchMove,{passive:false,capture:true});
document.addEventListener('gestureend',blockTouchMove,{passive:false,capture:true});
document.addEventListener('scroll',()=>{if(scrollX||scrollY)scrollTo(0,0)},{passive:true});
addEventListener('pointerdown',()=>{if(TOUCH_VIEWPORT)scrollTo(0,0);if(!paused)au();if(scene=='menu'&&set.mus&&!mu.run)mstart(3)},{capture:true});
function place(e){const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)*D/S+cam),y=Math.floor((GY-(e.clientY-r.top)*D)/S);hov=[x,y];if(y<0||y>9||x<0||!(e.buttons&3))return;
 const er=(e.buttons&2)||tool<0,i=LV.findIndex(o=>o[1]==x&&o[2]==y);if(i>=0){if(!er&&LV[i][0]==tool)return;LV.splice(i,1)}if(!er){LV.push([tool,x,y]);st.b++;if(st.b>=30)award(4);sfx(900,.03,'square',.01)}idx(LV)}
cv.addEventListener('pointerdown',e=>{if(scene=='play'){press();cv.setPointerCapture(e.pointerId)}else if(scene=='edit'){hist.push(JSON.stringify(LV));if(hist.length>60)hist.shift();place(e)}});
cv.addEventListener('pointermove',e=>{if(scene=='edit')place(e)});
cv.addEventListener('pointerup',()=>{hold=0;if(scene=='edit'){save();savS()}});
cv.addEventListener('pointerleave',()=>{hov=null});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{if(scene=='edit')cam=Math.max(-4,cam+(e.deltaX+e.deltaY)/S*D*.8)},{passive:true});
menu();
{const d=dec(location.hash.slice(1));if(d&&d.L.length){modal(`<h2>Level from a friend</h2><div style="font-size:10px">"${d.n.replace(/</g,'')}" · ${d.L.length} objects</div><button id="hp">▶ Play it</button><button class="c" id="he">✎ Open in Builder</button><button class="r" data-a="x">Not now</button>`);$('#hp').onclick=()=>{A.x();startPlay({id:'imp',n:d.n,th:d.th,L:d.L},'menu')};$('#he').onclick=()=>{LV=d.L;name=d.n;eth=d.th;save();cam=-3;A.x();edit(1)}}}
